version: 2
updates:
  # keeps the SHA pins in workflows current, rewriting the trailing "# v4" comment too
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      # one PR for routine bumps; majors still come through individually
      minor-and-patch:
        update-types: [minor, patch]
